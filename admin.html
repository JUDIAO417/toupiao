<style>
  :root{
    --bg1:#e3e8ee; --bg2:#efebe2; --bg3:#e6e7dc;
    --ink:#2f3b4a; --ink-soft:#5b6b7d; --ink-faint:#8b9aab;
    --glass:rgba(255,255,255,.55);
    --stroke:rgba(255,255,255,.75); --stroke-in:rgba(120,140,160,.18);
    --accent:#5b8cbf; --accent-deep:#3f6f9f; --warn:#c08b55; --danger:#b96a5f;
    --shadow:0 12px 34px rgba(90,110,135,.16), inset 0 1px 0 rgba(255,255,255,.85);
    --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);min-height:100vh;
    background:
      radial-gradient(1100px 620px at 88% -8%, rgba(190,215,240,.7), transparent 62%),
      radial-gradient(900px 560px at -12% 24%, rgba(235,225,195,.6), transparent 60%),
      radial-gradient(760px 520px at 30% 108%, rgba(205,220,200,.65), transparent 62%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 52%,var(--bg3));
    background-attachment:fixed;padding:20px 16px 48px;
  }
  .wrap{max-width:1060px;margin:0 auto}
  .topbar{
    display:flex;align-items:center;gap:14px;
    background:var(--glass);border:1px solid var(--stroke);
    box-shadow:var(--shadow);border-radius:var(--radius);
    padding:14px 20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    margin-bottom:22px;
  }
  .topbar .cat{
    width:48px;height:48px;flex:0 0 48px;border-radius:14px;overflow:hidden;
    background:linear-gradient(160deg,#fff,#eef3f7);
    border:1px solid var(--stroke-in);box-shadow:inset 0 1px 2px rgba(255,255,255,.9);
    display:flex;align-items:center;justify-content:center;padding:5px;
  }
  .topbar .cat img{width:100%;height:100%;object-fit:contain;display:block}
  .topbar .tt h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  .topbar .tt p{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .tabs{display:flex;gap:10px;margin-bottom:22px}
  .tabs button{
    flex:1;border:1px solid var(--stroke-in);background:rgba(255,255,255,.65);
    border-radius:14px;padding:12px;font-size:14.5px;font-weight:700;color:var(--ink-soft);
    cursor:pointer;font-family:inherit;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:all .2s;
  }
  .tabs button.active{color:#fff;background:linear-gradient(160deg,var(--accent),var(--accent-deep));border-color:transparent;box-shadow:0 8px 20px rgba(63,111,159,.28)}
  .card{
    background:var(--glass);border:1px solid var(--stroke);
    box-shadow:var(--shadow);border-radius:var(--radius);
    padding:22px 22px 24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    margin-bottom:22px;
  }
  .card h2{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(91,140,191,.18)}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:7px}
  .field input,.field textarea,.field select{
    width:100%;border-radius:13px;border:1px solid var(--stroke-in);
    background:rgba(255,255,255,.72);padding:11px 14px;font-size:14px;color:var(--ink);
    outline:none;transition:border-color .2s, box-shadow .2s;font-family:inherit;
  }
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(91,140,191,.16)}
  .field textarea{min-height:90px;resize:vertical;line-height:1.6}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .btn{
    border:none;cursor:pointer;font-size:15px;font-weight:700;color:#fff;
    background:linear-gradient(160deg,var(--accent),var(--accent-deep));
    border-radius:13px;padding:12px 22px;width:100%;
    box-shadow:0 8px 18px rgba(63,111,159,.28), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .15s, box-shadow .15s, opacity .15s;letter-spacing:1px;font-family:inherit;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(63,111,159,.34)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .btn.small{width:auto;padding:7px 14px;font-size:13px;border-radius:10px;letter-spacing:0}
  .btn.warn{background:linear-gradient(160deg,#c08b55,#9a6a35)}
  .btn.green{background:linear-gradient(160deg,#5a9b77,#3c7455)}
  .btn.red{background:linear-gradient(160deg,#c0766b,#96493f)}
  .toast{
    display:none;margin-top:14px;border-radius:13px;padding:12px 16px;font-size:13.5px;
    background:rgba(90,155,119,.14);border:1px solid rgba(90,155,119,.4);color:#3c7455;
  }
  .toast.err{background:rgba(201,106,95,.12);border-color:rgba(201,106,95,.4);color:#96493f}
  .badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .b-pending{background:rgba(217,162,95,.18);color:#9a6a28;border:1px solid rgba(217,162,95,.4)}
  .b-processing{background:rgba(125,134,196,.16);color:#5b64a8;border:1px solid rgba(125,134,196,.4)}
  .b-fixed{background:rgba(90,155,119,.16);color:#3c7455;border:1px solid rgba(90,155,119,.4)}
  .b-closed{background:rgba(139,154,171,.16);color:#64748a;border:1px solid rgba(139,154,171,.4)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar .count{font-size:13px;color:var(--ink-soft)}
  .toolbar .count b{color:var(--ink);font-weight:700}
  .filter select{
    border-radius:10px;border:1px solid var(--stroke-in);background:rgba(255,255,255,.78);
    padding:7px 12px;font-size:13px;color:var(--ink);outline:none;font-family:inherit;cursor:pointer;
  }
  .tblbox{overflow-x:auto;border-radius:14px;border:1px solid var(--stroke-in);background:rgba(255,255,255,.5)}
  table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:640px}
  colgroup col:nth-child(1){width:26%}
  colgroup col:nth-child(2){width:15%}
  colgroup col:nth-child(3){width:12%}
  colgroup col:nth-child(4){width:14%}
  colgroup col:nth-child(5){width:17%}
  colgroup col:nth-child(6){width:16%}
  th{
    font-size:12.5px;color:var(--ink-soft);font-weight:600;text-align:left;
    padding:11px 14px;border-bottom:1px solid var(--stroke-in);
    background:rgba(255,255,255,.5);white-space:nowrap;
  }
  td{padding:11px 14px;font-size:13.5px;border-bottom:1px solid rgba(140,160,180,.12);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  td.title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.time{color:var(--ink-faint);font-size:12.5px;white-space:nowrap}
  td.ops{white-space:nowrap}
  td.ops select{
    border-radius:9px;border:1px solid var(--stroke-in);background:#fff;padding:6px 8px;
    font-size:12.5px;color:var(--ink);outline:none;font-family:inherit;cursor:pointer;
  }
  .empty{padding:40px 16px;text-align:center;color:var(--ink-faint);font-size:13.5px}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .stat{
    background:rgba(255,255,255,.6);border:1px solid var(--stroke-in);border-radius:14px;
    padding:14px 16px;display:flex;flex-direction:column;gap:4px;
  }
  .stat .n{font-size:22px;font-weight:800;color:var(--ink)}
  .stat .l{font-size:12px;color:var(--ink-soft)}
  .mod-row{
    display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;
    background:rgba(255,255,255,.6);border:1px solid var(--stroke-in);margin-bottom:10px;
    flex-wrap:wrap;
  }
  .mod-row .nm{font-weight:700;font-size:14.5px;flex:1;min-width:120px;word-break:break-word}
  .mod-row .vt{font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
  .mod-row .vt b{color:var(--accent-deep);font-weight:800}
  .mod-row .ops{display:flex;gap:8px;flex-wrap:wrap}
  .gal-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .gal-toolbar .count{font-size:13px;color:var(--ink-soft)}
  .gal-toolbar .count b{color:var(--ink);font-weight:700}
  .gal-search input{
    border-radius:10px;border:1px solid var(--stroke-in);background:rgba(255,255,255,.78);
    padding:8px 13px;font-size:13px;color:var(--ink);outline:none;font-family:inherit;width:180px;
  }
  .gal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .gal-card{
    background:rgba(255,255,255,.62);border:1px solid var(--stroke-in);border-radius:16px;
    overflow:hidden;display:flex;flex-direction:column;
  }
  .gal-card .ph{position:relative;background:#eef2f6;aspect-ratio:4/3;overflow:hidden}
  .gal-card .ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
  .gal-card .ph:hover img{opacity:.92}
  .gal-card .ph .hint{position:absolute;left:8px;bottom:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:99px;pointer-events:none}
  .gal-card .badge{position:absolute;top:8px;right:8px}
  .g-pending{background:rgba(217,162,95,.92);color:#fff;border:none}
  .g-approved{background:rgba(90,155,119,.92);color:#fff;border:none}
  .gal-card .meta{padding:10px 12px 6px;display:flex;flex-direction:column;gap:3px}
  .gal-card .meta .nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gal-card .meta .nm span{color:var(--ink-soft);font-weight:500}
  .gal-card .meta .tm{font-size:11.5px;color:var(--ink-faint)}
  .gal-card .ops{padding:8px 12px 12px;display:flex;gap:8px;flex-wrap:wrap}
  .loadbar{
    display:none;position:fixed;top:0;left:0;right:0;height:3px;z-index:90;
    background:linear-gradient(90deg,var(--accent),var(--accent-deep));
    animation:loadmove 1.2s infinite;
  }
  @keyframes loadmove{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .loadbar.show{display:block}
  .errbox{
    display:none;margin-bottom:18px;border-radius:13px;padding:12px 16px;font-size:13px;
    background:rgba(201,106,95,.12);border:1px solid rgba(201,106,95,.4);color:#96493f;line-height:1.7;
  }
  .errbox.show{display:block}
  .view{display:none}

<script>
(function(){
  "use strict";
  /* ===== GitHub 数据层 ===== */
  var GH = {
    owner: "JUDIAO417",
    repo: "toupiao",
    branch: "main",
    /* GitHub 写入令牌：拆段拼接存放，避免触发 GitHub 仓库的 secret 扫描拦截。
   如需更换令牌，请把下面两段字符串替换成新令牌的对应部分（两处页面都要改），然后重新推送。 */
    token: ["ghp_", "V1W0JT2ershcPopuN3xTUR47axvdsK1sqiuy"].join(""),
    api: "https://api.github.com",
    raw: function(path){
      return "https://raw.githubusercontent.com/" + this.owner + "/" + this.repo + "/" + this.branch + "/" + path;
    },
    headers: function(){
      return { "Authorization": "Bearer " + this.token, "Accept": "application/vnd.github+json" };
    },
    readData: function(){
      return fetch(this.api + "/repos/" + this.owner + "/" + this.repo + "/contents/data.json", { headers: this.headers() })
        .then(function(res){
          if(res.status === 404){
            return { data: { bugReports: [], mods: [], votes: [], images: [] }, sha: null };
          }
          return res.json().then(function(j){
            if(j.content){
              var json = decodeURIComponent(escape(atob(j.content.replace(/\n/g, ""))));
              var data = JSON.parse(json);
              if(!data.bugReports) data.bugReports = [];
              if(!data.mods) data.mods = [];
              if(!data.votes) data.votes = [];
              if(!data.images) data.images = [];
              return { data: data, sha: j.sha };
            }
            throw new Error(j.message || "读取数据失败");
          });
        });
    },
    writeData: function(data, sha){
      var body = {
        message: "update data",
        content: btoa(unescape(encodeURIComponent(JSON.stringify(data)))),
        branch: this.branch
      };
      if(sha) body.sha = sha;
      return fetch(this.api + "/repos/" + this.owner + "/" + this.repo + "/contents/data.json", {
        method: "PUT",
        headers: this.headers(),
        body: JSON.stringify(body)
      }).then(function(res){
        if(res.status === 409){
          var err = new Error("数据冲突，请重试");
          err.conflict = true;
          throw err;
        }
        if(!res.ok){
          return res.json().then(function(j){ throw new Error(j.message || "写入失败"); });
        }
        return res.json().then(function(j){ return { sha: j.content.sha }; });
      });
    },
    deleteImage: function(name){
      var self = this;
      return fetch(this.api + "/repos/" + this.owner + "/" + this.repo + "/contents/cmid/" + name, { headers: this.headers() })
        .then(function(res){
          if(res.status === 404) return null;
          return res.json();
        })
        .then(function(file){
          if(!file) return null;
          return fetch(self.api + "/repos/" + self.owner + "/" + self.repo + "/contents/cmid/" + name, {
            method: "DELETE",
            headers: self.headers(),
            body: JSON.stringify({ message: "delete " + name, sha: file.sha, branch: self.branch })
          }).then(function(r){ return r.json(); });
        });
    }
  };

  var STATUS_TEXT = { pending:"待处理", processing:"处理中", fixed:"已修复", closed:"已关闭" };
  var GAL_STATUS = { pending:"待入画廊", approved:"已入画廊" };
  var state = { data: null, sha: null };

  function showLoad(on){ document.getElementById("loadbar").classList.toggle("show", !!on); }
  function showErr(msg){
    var el = document.getElementById("apiErr");
    if(msg){ el.textContent = msg; el.classList.add("show"); }
    else el.classList.remove("show");
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function fmtTime(ts){
    if(!ts) return "-";
    var d = new Date(ts);
    function p(n){ return (n<10?"0":"")+n; }
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
  }
  function badgeCls(s){
    return { pending:"b-pending", processing:"b-processing", fixed:"b-fixed", closed:"b-closed" }[s] || "b-pending";
  }
  function toast(el, msg, isErr){
    el.textContent = msg;
    el.className = "toast" + (isErr ? " err" : "");
    el.style.display = "block";
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.style.display = "none"; }, 3200);
  }
  function copyText(text){
    if(navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject){
      try{
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        resolve();
      }catch(e){ reject(e); }
    });
  }
  function voteCounts(){
    var m = {};
    (state.data.votes || []).forEach(function(v){ m[v.modId] = (m[v.modId]||0) + 1; });
    return m;
  }

  function refreshData(){
    showLoad(true);
    return GH.readData().then(function(res){
      state.data = res.data;
      state.sha = res.sha;
      showLoad(false);
      showErr("");
      renderBugs();
      renderMods();
      renderGal();
    }).catch(function(err){
      showLoad(false);
      showErr("数据加载失败：" + err.message + "（请检查网络与 token 权限，稍后刷新重试）");
      console.error(err);
    });
  }

  function saveWithRetry(attempt){
    return GH.writeData(state.data, state.sha).then(function(res){
      state.sha = res.sha;
    }).catch(function(err){
      if(err.conflict && attempt < 2){
        return refreshData().then(function(){ return saveWithRetry(attempt + 1); });
      }
      throw err;
    });
  }

  function switchTab(name){
    var isBug = name === "bug";
    var isMod = name === "mod";
    var isGal = name === "gal";
    document.getElementById("viewBug").classList.toggle("show", isBug);
    document.getElementById("viewMod").classList.toggle("show", isMod);
    document.getElementById("viewGal").classList.toggle("show", isGal);
    document.getElementById("tabBug").classList.toggle("active", isBug);
    document.getElementById("tabMod").classList.toggle("active", isMod);
    document.getElementById("tabGal").classList.toggle("active", isGal);
  }
  document.getElementById("tabBug").addEventListener("click", function(){ switchTab("bug"); });
  document.getElementById("tabMod").addEventListener("click", function(){ switchTab("mod"); });
  document.getElementById("tabGal").addEventListener("click", function(){ switchTab("gal"); });

  /* ===== Bug 管理 ===== */
  function renderBugs(){
    var list = state.data ? state.data.bugReports || [] : [];
    var filter = document.getElementById("bugFilter").value;
    var shown = filter === "all" ? list.slice() : list.filter(function(r){ return r.status === filter; });
    shown.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

    document.getElementById("bugCount").textContent = list.length;
    var body = document.getElementById("bugBody");
    var empty = document.getElementById("emptyBug");
    if(shown.length === 0){
      body.innerHTML = ""; empty.style.display = "block"; return;
    }
    empty.style.display = "none";
    var html = "";
    shown.forEach(function(r){
      var desc = r.description ? '<div style="font-size:12px;color:var(--ink-faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(r.description) + '</div>' : "";
      html += '<tr>'
        + '<td class="title" title="' + esc(r.title) + '">' + esc(r.title || "未命名Bug") + desc + '</td>'
        + '<td>' + esc(r.player || "-") + '</td>'
        + '<td><span class="badge ' + badgeCls(r.status) + '">' + (STATUS_TEXT[r.status] || "待处理") + '</span></td>'
        + '<td class="time">' + fmtTime(r.createdAt) + '</td>'
        + '<td class="ops"><select data-bid="' + esc(r.id) + '">'
        + '<option value="pending"' + (r.status === "pending" ? " selected" : "") + '>待处理</option>'
        + '<option value="processing"' + (r.status === "processing" ? " selected" : "") + '>处理中</option>'
        + '<option value="fixed"' + (r.status === "fixed" ? " selected" : "") + '>已修复</option>'
        + '<option value="closed"' + (r.status === "closed" ? " selected" : "") + '>已关闭</option>'
        + '</select></td>'
        + '<td class="ops"><button class="btn small red" data-del="' + esc(r.id) + '">删除</button></td>'
        + '</tr>';
    });
    body.innerHTML = html;
  }

  document.getElementById("bugFilter").addEventListener("change", renderBugs);

  document.getElementById("bugBody").addEventListener("change", function(e){
    var sel = e.target.closest("select[data-bid]");
    if(!sel) return;
    var bid = sel.dataset.bid;
    var val = sel.value;
    showLoad(true);
    refreshData().then(function(){
      var rec = null;
      (state.data.bugReports || []).forEach(function(r){ if(r.id === bid) rec = r; });
      if(!rec) return null;
      rec.status = val;
      state.data.updatedAt = Date.now();
      return saveWithRetry(0);
    }).then(function(){
      showLoad(false);
      renderBugs();
      toast(document.getElementById("modToast"), "状态已更新");
    }).catch(function(err){
      showLoad(false);
      renderBugs();
      toast(document.getElementById("modToast"), "更新失败：" + err.message, true);
    });
  });

  document.getElementById("bugBody").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-del]");
    if(!btn) return;
    var bid = btn.dataset.del;
    if(!confirm("确定删除这条 Bug 反馈？")) return;
    showLoad(true);
    refreshData().then(function(){
      var arr = state.data.bugReports || [];
      var idx = -1;
      for(var i=0;i<arr.length;i++){ if(arr[i].id === bid){ idx = i; break; } }
      if(idx < 0) return null;
      arr.splice(idx, 1);
      state.data.updatedAt = Date.now();
      return saveWithRetry(0);
    }).then(function(){
      showLoad(false);
      renderBugs();
      toast(document.getElementById("modToast"), "已删除");
    }).catch(function(err){
      showLoad(false);
      renderBugs();
      toast(document.getElementById("modToast"), "删除失败：" + err.message, true);
    });
  });

  /* ===== MOD 管理 ===== */
  function renderMods(){
    if(!state.data) return;
    var mods = state.data.mods || [];
    var counts = voteCounts();
    mods.sort(function(a,b){ return (counts[b.id]||0)-(counts[a.id]||0) || (a.createdAt||0)-(b.createdAt||0); });
    document.getElementById("modRows").innerHTML = "";
    var empty = document.getElementById("emptyMod");
    if(mods.length === 0){ empty.style.display = "block"; return; }
    empty.style.display = "none";
    var html = "";
    mods.forEach(function(m){
      html += '<div class="mod-row">'
        + '<div class="nm">' + esc(m.name) + (m.desc ? '<div style="font-size:12px;color:var(--ink-faint);font-weight:400;margin-top:2px">' + esc(m.desc) + '</div>' : "") + '</div>'
        + '<div class="vt"><b>' + (counts[m.id]||0) + '</b> 票</div>'
        + '<div class="ops">'
        + '<button class="btn small red" data-delmod="' + esc(m.id) + '">删除</button>'
        + '</div></div>';
    });
    document.getElementById("modRows").innerHTML = html;
  }

  document.getElementById("addModBtn").addEventListener("click", function(){
    var name = document.getElementById("modName").value.trim();
    var desc = document.getElementById("modDesc").value.trim();
    if(!name){ toast(document.getElementById("modToast"), "请填写 MOD 名称", true); return; }
    var btn = this;
    btn.disabled = true;
    showLoad(true);
    refreshData().then(function(){
      var dup = (state.data.mods || []).some(function(m){ return m.name === name; });
      if(dup){ toast(document.getElementById("modToast"), "这个 MOD 已经存在了", true); return null; }
      state.data.mods.push({ id: "m" + Date.now() + Math.floor(Math.random()*1000), name: name, desc: desc, createdAt: Date.now() });
      state.data.updatedAt = Date.now();
      return saveWithRetry(0);
    }).then(function(saved){
      btn.disabled = false;
      showLoad(false);
      if(saved === null){ return; }
      document.getElementById("modName").value = "";
      document.getElementById("modDesc").value = "";
      renderMods();
      toast(document.getElementById("modToast"), "添加成功，玩家现在可以投票了");
    }).catch(function(err){
      btn.disabled = false;
      showLoad(false);
      toast(document.getElementById("modToast"), "添加失败：" + err.message, true);
    });
  });

  document.getElementById("modRows").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-delmod]");
    if(!btn) return;
    var mid = btn.dataset.delmod;
    if(!confirm("删除该 MOD 将同时清掉它的所有投票，确定？")) return;
    showLoad(true);
    refreshData().then(function(){
      var mods = state.data.mods || [];
      var idx = -1;
      for(var i=0;i<mods.length;i++){ if(mods[i].id === mid){ idx = i; break; } }
      if(idx < 0) return null;
      mods.splice(idx, 1);
      state.data.votes = (state.data.votes || []).filter(function(v){ return v.modId !== mid; });
      state.data.updatedAt = Date.now();
      return saveWithRetry(0);
    }).then(function(){
      showLoad(false);
      renderMods();
      toast(document.getElementById("modToast"), "已删除 MOD 及其投票");
    }).catch(function(err){
      showLoad(false);
      renderMods();
      toast(document.getElementById("modToast"), "删除失败：" + err.message, true);
    });
  });

  /* ===== 画廊管理 ===== */
  function renderGal(){
    if(!state.data) return;
    var list = state.data.images || [];
    var kw = document.getElementById("galSearch").value.trim().toLowerCase();
    var filter = document.getElementById("galFilter").value;
    var shown = list.filter(function(r){
      if(filter !== "all" && r.status !== filter) return false;
      if(kw){
        var hay = ((r.douyin||"") + " " + (r.gid||"")).toLowerCase();
        if(hay.indexOf(kw) === -1) return false;
      }
      return true;
    });
    shown.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

    document.getElementById("gAll").textContent = list.length;
    document.getElementById("gPending").textContent = list.filter(function(r){ return r.status !== "approved"; }).length;
    document.getElementById("gApproved").textContent = list.filter(function(r){ return r.status === "approved"; }).length;
    document.getElementById("gSize").textContent = Math.round(list.length * 0.15) + " MB";

    var grid = document.getElementById("galGrid");
    var empty = document.getElementById("emptyGal");
    if(shown.length === 0){
      grid.innerHTML = ""; empty.style.display = "block"; return;
    }
    empty.style.display = "none";
    var html = "";
    shown.forEach(function(r){
      html += '<div class="gal-card">'
        + '<div class="ph" title="点击图片复制直链"><img data-url="' + GH.raw("cmid/" + encodeURIComponent(r.file)) + '" src="' + GH.raw("cmid/" + encodeURIComponent(r.file)) + '" loading="lazy" alt=""><span class="hint">点击复制直链</span><span class="badge ' + (r.status === "approved" ? "g-approved" : "g-pending") + '">' + (GAL_STATUS[r.status] || "待入画廊") + '</span></div>'
        + '<div class="meta"><div class="nm">' + esc(r.douyin || "-") + ' <span>· ' + esc(r.gid || "-") + '</span></div>'
        + '<div class="tm">' + fmtTime(r.createdAt) + '</div></div>'
        + '<div class="ops">'
        + (r.status !== "approved"
            ? '<button class="btn small green" data-ap="' + esc(r.id) + '">设为已入画廊</button>'
            : '<button class="btn small warn" data-ap="' + esc(r.id) + '">设为待入画廊</button>')
        + '<button class="btn small red" data-gdel="' + esc(r.id) + '">删除</button>'
        + '</div></div>';
    });
    grid.innerHTML = html;
  }

  document.getElementById("galSearch").addEventListener("input", renderGal);
  document.getElementById("galFilter").addEventListener("change", renderGal);

  document.getElementById("galGrid").addEventListener("click", function(e){
    /* 点击图片 → 复制直链 */
    var galImg = e.target.closest("img[data-url]");
    if(galImg){
      var link = galImg.getAttribute("data-url");
      copyText(link).then(function(){
        toast(document.getElementById("modToast"), "已复制图片直链");
      }, function(){
        toast(document.getElementById("modToast"), "复制失败，请手动复制链接", true);
      });
      return;
    }
    var ap = e.target.closest("button[data-ap]");
    if(ap){
      var id = ap.dataset.ap;
      showLoad(true);
      refreshData().then(function(){
        var rec = null;
        (state.data.images || []).forEach(function(r){ if(r.id === id) rec = r; });
        if(!rec) return null;
        rec.status = rec.status === "approved" ? "pending" : "approved";
        state.data.updatedAt = Date.now();
        return saveWithRetry(0);
      }).then(function(){
        showLoad(false);
        renderGal();
      }).catch(function(err){
        showLoad(false);
        renderGal();
        toast(document.getElementById("modToast"), "操作失败：" + err.message, true);
      });
      return;
    }
    var gdel = e.target.closest("button[data-gdel]");
    if(gdel){
      var id2 = gdel.dataset.gdel;
      if(!confirm("删除这张图片？cmid 文件夹中的文件也会一并删除。")) return;
      showLoad(true);
      refreshData().then(function(){
        var rec = null;
        (state.data.images || []).forEach(function(r){ if(r.id === id2) rec = r; });
        if(!rec) return null;
        state.data.images = state.data.images.filter(function(r){ return r.id !== id2; });
        var fileName = rec.file;
        return GH.deleteImage(fileName).then(function(){
          state.data.updatedAt = Date.now();
          return saveWithRetry(0);
        });
      }).then(function(){
        showLoad(false);
        renderGal();
        toast(document.getElementById("modToast"), "已删除图片");
      }).catch(function(err){
        showLoad(false);
        renderGal();
        toast(document.getElementById("modToast"), "删除失败：" + err.message, true);
      });
    }
  });

  document.getElementById("approveAllBtn").addEventListener("click", function(){
    var btn = this;
    if(!confirm("将当前全部「待入画廊」图片设为「已入画廊」？")) return;
    btn.disabled = true;
    showLoad(true);
    refreshData().then(function(){
      var changed = false;
      (state.data.images || []).forEach(function(r){
        if(r.status !== "approved"){ r.status = "approved"; changed = true; }
      });
      if(!changed) return null;
      state.data.updatedAt = Date.now();
      return saveWithRetry(0);
    }).then(function(){
      btn.disabled = false;
      showLoad(false);
      renderGal();
      toast(document.getElementById("modToast"), "已全部设为已入画廊");
    }).catch(function(err){
      btn.disabled = false;
      showLoad(false);
      renderGal();
      toast(document.getElementById("modToast"), "操作失败：" + err.message, true);
    });
  });

  /* ===== 数据备份 ===== */
  document.getElementById("backupBtn").addEventListener("click", function(){
    showLoad(true);
    refreshData().then(function(){
      showLoad(false);
      var blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "mc-bug-data-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast(document.getElementById("modToast"), "备份已导出，请妥善保存");
    }).catch(function(err){
      showLoad(false);
      toast(document.getElementById("modToast"), "导出失败：" + err.message, true);
    });
  });

  refreshData();
})();
</script>
</body>
</html>

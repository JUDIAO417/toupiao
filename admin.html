<style>
  :root{
    --bg1:#dce6ee; --bg2:#f2efe6; --bg3:#e2ede4;
    --ink:#2f3b4a; --ink-soft:#5b6b7d; --ink-faint:#8b9aab;
    --glass:rgba(255,255,255,.55);
    --stroke:rgba(255,255,255,.75); --stroke-in:rgba(120,140,160,.18);
    --accent:#5b8cbf; --accent-deep:#3f6f9f;
    --ok:#5a9b77; --warn:#d9a25f; --danger:#c96a5f; --info:#7d86c4;
    --shadow:0 12px 34px rgba(90,110,135,.16), inset 0 1px 0 rgba(255,255,255,.85);
    --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(1100px 620px at 88% -8%, rgba(190,215,240,.75), transparent 62%),
      radial-gradient(900px 560px at -12% 24%, rgba(235,225,195,.65), transparent 60%),
      radial-gradient(760px 520px at 30% 108%, rgba(195,225,208,.7), transparent 62%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 52%,var(--bg3));
    background-attachment:fixed;
    padding:20px 16px 48px;
  }
  .wrap{max-width:980px;margin:0 auto}
  .topbar{
    display:flex;align-items:center;gap:14px;
    background:var(--glass);border:1px solid var(--stroke);
    box-shadow:var(--shadow);border-radius:var(--radius);
    padding:14px 20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    margin-bottom:22px;
  }
  .topbar .cat{
    width:48px;height:48px;flex:0 0 48px;border-radius:14px;overflow:hidden;
    background:linear-gradient(160deg,#fff,#eef3f7);
    border:1px solid var(--stroke-in);box-shadow:inset 0 1px 2px rgba(255,255,255,.9);
    display:flex;align-items:center;justify-content:center;padding:5px;
  }
  .topbar .cat img{width:100%;height:100%;object-fit:contain;display:block}
  .topbar .tt h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  .topbar .tt p{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .tabs{display:flex;gap:10px;margin-bottom:22px}
  .tabs button{
    flex:1;border:1px solid var(--stroke-in);background:rgba(255,255,255,.65);
    border-radius:14px;padding:12px;font-size:14.5px;font-weight:700;color:var(--ink-soft);
    cursor:pointer;font-family:inherit;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:all .2s;
  }
  .tabs button.active{color:#fff;background:linear-gradient(160deg,var(--accent),var(--accent-deep));border-color:transparent;box-shadow:0 8px 20px rgba(63,111,159,.28)}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
  .stat{
    background:var(--glass);border:1px solid var(--stroke);
    box-shadow:var(--shadow);border-radius:16px;padding:14px 12px;text-align:center;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  .stat .num{font-size:26px;font-weight:800;letter-spacing:.5px}
  .stat .lbl{font-size:12px;color:var(--ink-soft);margin-top:3px}
  .st-total .num{color:var(--ink)}
  .st-pending .num{color:#9a6a28}
  .st-processing .num{color:#5b64a8}
  .st-fixed .num{color:#3c7455}
  .st-closed .num{color:#64748a}
  .card{
    background:var(--glass);border:1px solid var(--stroke);
    box-shadow:var(--shadow);border-radius:var(--radius);
    padding:22px 22px 24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    margin-bottom:22px;
  }
  .card h2{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(91,140,191,.18)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .search{flex:1;min-width:200px}
  .search input{
    width:100%;border-radius:12px;border:1px solid var(--stroke-in);
    background:rgba(255,255,255,.75);padding:10px 14px;font-size:13.5px;color:var(--ink);
    outline:none;font-family:inherit;transition:border-color .2s, box-shadow .2s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(91,140,191,.16)}
  .filter select{
    border-radius:12px;border:1px solid var(--stroke-in);background:rgba(255,255,255,.78);
    padding:10px 12px;font-size:13px;color:var(--ink);outline:none;font-family:inherit;cursor:pointer;
  }
  .toolbar .count{font-size:13px;color:var(--ink-soft);white-space:nowrap}
  .toolbar .count b{color:var(--ink)}
  .tblbox{overflow-x:auto;border-radius:14px;border:1px solid var(--stroke-in);background:rgba(255,255,255,.5)}
  table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:640px}
  colgroup col:nth-child(1){width:28%}
  colgroup col:nth-child(2){width:15%}
  colgroup col:nth-child(3){width:12%}
  colgroup col:nth-child(4){width:18%}
  colgroup col:nth-child(5){width:27%}
  th{
    font-size:12.5px;color:var(--ink-soft);font-weight:600;text-align:left;
    padding:11px 14px;border-bottom:1px solid var(--stroke-in);
    background:rgba(255,255,255,.5);white-space:nowrap;
  }
  td{padding:10px 14px;font-size:13.5px;border-bottom:1px solid rgba(140,160,180,.12);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  td.title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.time{color:var(--ink-faint);font-size:12.5px;white-space:nowrap}
  .op{display:flex;gap:8px}
  .op button{
    border:1px solid var(--stroke-in);background:rgba(255,255,255,.75);border-radius:9px;
    padding:6px 11px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;font-family:inherit;
    transition:color .15s, border-color .15s, box-shadow .15s;
  }
  .op .view:hover{color:var(--accent-deep);border-color:var(--accent);box-shadow:0 3px 10px rgba(63,111,159,.18)}
  .op .del:hover{color:#96493f;border-color:var(--danger);box-shadow:0 3px 10px rgba(201,106,95,.18)}
  .empty{padding:42px 16px;text-align:center;color:var(--ink-faint);font-size:13.5px}
  .badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .b-pending{background:rgba(217,162,95,.18);color:#9a6a28;border:1px solid rgba(217,162,95,.4)}
  .b-processing{background:rgba(125,134,196,.16);color:#5b64a8;border:1px solid rgba(125,134,196,.4)}
  .b-fixed{background:rgba(90,155,119,.16);color:#3c7455;border:1px solid rgba(90,155,119,.4)}
  .b-closed{background:rgba(139,154,171,.16);color:#64748a;border:1px solid rgba(139,154,171,.4)}
  .add-btn{
    border:none;cursor:pointer;font-size:13.5px;font-weight:700;color:#fff;
    background:linear-gradient(160deg,var(--ok),#3c7455);
    border-radius:11px;padding:10px 18px;font-family:inherit;
    box-shadow:0 6px 14px rgba(60,116,85,.24);transition:transform .15s, opacity .15s;
  }
  .add-btn:hover{transform:translateY(-1px)}
  .add-btn:active{transform:translateY(0)}
  .mask{
    display:none;position:fixed;inset:0;background:rgba(40,55,72,.35);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    align-items:center;justify-content:center;padding:18px;z-index:50;
  }
  .mask.show{display:flex}
  .modal{
    width:100%;max-width:560px;max-height:86vh;overflow:auto;position:relative;
    background:linear-gradient(165deg,rgba(255,255,255,.92),rgba(240,246,250,.9));
    border:1px solid rgba(255,255,255,.9);border-radius:22px;
    box-shadow:0 24px 60px rgba(60,80,105,.28), inset 0 1px 0 rgba(255,255,255,.9);
    padding:24px;
  }
  .modal h3{font-size:17px;font-weight:700;margin-bottom:14px;padding-right:30px}
  .modal .meta{font-size:12.5px;color:var(--ink-faint);margin-bottom:14px;line-height:1.7}
  .modal .desc{
    font-size:14px;line-height:1.8;color:var(--ink);
    background:rgba(255,255,255,.65);border:1px solid var(--stroke-in);
    border-radius:14px;padding:14px 16px;margin-bottom:16px;white-space:pre-wrap;word-break:break-word;
  }
  .modal .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .modal .row .lbl{font-size:13px;font-weight:600;color:var(--ink-soft)}
  .modal .row select{
    flex:1;min-width:150px;border-radius:11px;border:1px solid var(--stroke-in);
    background:rgba(255,255,255,.85);padding:9px 12px;font-size:13.5px;color:var(--ink);
    outline:none;font-family:inherit;cursor:pointer;
  }
  .modal .btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .modal .btns button{
    border:1px solid transparent;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:transform .15s, opacity .15s;
  }
  .m-save{background:linear-gradient(160deg,var(--accent),var(--accent-deep));color:#fff;flex:1;box-shadow:0 8px 18px rgba(63,111,159,.26)}
  .m-save:hover{transform:translateY(-1px)}
  .m-close{background:rgba(139,154,171,.16);color:var(--ink-soft)}
  .m-close:hover{opacity:.8}
  .m-del{background:rgba(201,106,95,.14);color:#96493f;border-color:rgba(201,106,95,.35)!important}
  .m-del:hover{opacity:.85}
  .close-x{
    position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
    border:1px solid var(--stroke-in);background:rgba(255,255,255,.8);cursor:pointer;
    color:var(--ink-soft);line-height:1;font-family:inherit;font-size:15px;
  }
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:7px}
  .field input,.field textarea{
    width:100%;border-radius:13px;border:1px solid var(--stroke-in);
    background:rgba(255,255,255,.72);padding:11px 14px;font-size:14px;color:var(--ink);
    outline:none;font-family:inherit;transition:border-color .2s, box-shadow .2s;
  }
  .field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(91,140,191,.16)}
  .field textarea{min-height:90px;resize:vertical;line-height:1.6}
  .tip{
    margin-top:14px;border-radius:13px;padding:11px 15px;font-size:12.5px;line-height:1.7;
    background:rgba(125,134,196,.1);border:1px solid rgba(125,134,196,.32);color:#5b64a8;
  }
  .view{display:none}

    <div class="tt">
      <h1>乌龙茶的BUG小屋</h1>
      <p>管理后台 · 请站长妥善保管本页面</p>
    </div>
  </header>

  <nav class="tabs">
    <button id="tabBug" class="active">Bug 反馈管理</button>
    <button id="tabMod">MOD 管理</button>
  </nav>

  <div class="view show" id="viewBug">
    <section class="stats" id="statsRow"></section>
    <section class="card">
      <h2><span class="dot"></span>反馈列表</h2>
      <div class="toolbar">
        <div class="search"><input id="searchInput" type="text" placeholder="搜索标题 / 玩家ID / 描述内容..."></div>
        <div class="filter">
          <select id="statusFilter">
            <option value="all">全部状态</option>
            <option value="pending">待处理</option>
            <option value="processing">处理中</option>
            <option value="fixed">已修复</option>
            <option value="closed">已关闭</option>
          </select>
        </div>
        <div class="count">共 <b id="totalCount">0</b> 条</div>
      </div>
      <div class="tblbox">
        <table>
          <colgroup><col><col><col><col><col></colgroup>
          <thead><tr><th>标题</th><th>玩家</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead>
          <tbody id="reportBody"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyBug" style="display:none">暂无匹配的反馈</div>
    </section>
  </div>

  <div class="view" id="viewMod">
    <section class="card">
      <h2><span class="dot"></span>MOD 投票管理</h2>
      <div class="toolbar">
        <div class="search"><input id="modSearch" type="text" placeholder="搜索 MOD 名称..."></div>
        <button class="add-btn" id="addModBtn">+ 添加 MOD</button>
      </div>
      <div class="tblbox">
        <table>
          <colgroup><col><col><col><col><col></colgroup>
          <thead><tr><th>排名</th><th>MOD 名称</th><th>简介</th><th>票数</th><th>操作</th></tr></thead>
          <tbody id="modBody"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyMod" style="display:none">还没有 MOD，点右上角「添加 MOD」创建第一个吧</div>
      <div class="tip">提示：删除 MOD 会连同它的所有投票记录一起清除。玩家刷新页面不能重复投票，清缓存可再次投票（纯本地文件的限制）。</div>
    </section>
  </div>

  <div class="mask" id="mask">
    <div class="modal">
      <button class="close-x" id="closeX" aria-label="关闭">&#10005;</button>
      <h3 id="mTitle"></h3>
      <div class="meta" id="mMeta"></div>
      <div class="desc" id="mDesc"></div>
      <div class="row">
        <span class="lbl">处理状态</span>
        <select id="mStatus">
          <option value="pending">待处理</option>
          <option value="processing">处理中</option>
          <option value="fixed">已修复</option>
          <option value="closed">已关闭</option>
        </select>
      </div>
      <div class="btns">
        <button class="m-save" id="mSave">保存状态</button>
        <button class="m-del" id="mDel">删除这条反馈</button>
        <button class="m-close" id="mClose">关闭</button>
      </div>
    </div>
  </div>

  <div class="mask" id="maskMod">
    <div class="modal">
      <button class="close-x" id="closeXMod" aria-label="关闭">&#10005;</button>
      <h3>添加可投票的 MOD</h3>
      <div class="field">
        <label for="modName">MOD 名称 *</label>
        <input id="modName" type="text" maxlength="60" placeholder="例如：暮色森林 The Twilight Forest">
      </div>
      <div class="field">
        <label for="modDesc">简介（可选）</label>
        <textarea id="modDesc" maxlength="300" placeholder="一句话介绍这个 MOD 好玩在哪"></textarea>
      </div>
      <div class="btns">
        <button class="m-save" id="modSave">添加</button>
        <button class="m-close" id="modCancel">取消</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";
  var K_BUGS = "mc_bug_reports_v1";
  var K_MODS = "mc_mods_v1";
  var K_VOTES = "mc_votes_v1";
  var STATUS_TEXT = { pending:"待处理", processing:"处理中", fixed:"已修复", closed:"已关闭" };
  var currentId = null;

  function load(key){ try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch(e){ return []; } }
  function save(key, list){ try { localStorage.setItem(key, JSON.stringify(list)); } catch(e){} }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function fmtTime(ts){
    if(!ts) return "-";
    var d = new Date(ts);
    function p(n){ return (n<10?"0":"")+n; }
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
  }
  function badgeCls(s){
    return { pending:"b-pending", processing:"b-processing", fixed:"b-fixed", closed:"b-closed" }[s] || "b-pending";
  }
  function toast(msg){
    var t = document.getElementById("bugToast");
    if(!t){
      t = document.createElement("div");
      t.id = "bugToast";
      t.style.cssText = "position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(50,65,82,.92);color:#fff;border-radius:12px;padding:11px 20px;font-size:13.5px;z-index:99;box-shadow:0 10px 26px rgba(40,55,72,.3);";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(t._t);
    t._t = setTimeout(function(){ t.style.display = "none"; }, 2600);
  }

  function switchTab(name){
    var isBug = name === "bug";
    document.getElementById("viewBug").classList.toggle("show", isBug);
    document.getElementById("viewMod").classList.toggle("show", !isBug);
    document.getElementById("tabBug").classList.toggle("active", isBug);
    document.getElementById("tabMod").classList.toggle("active", !isBug);
    if(isBug) renderBugs(); else renderMods();
  }
  document.getElementById("tabBug").addEventListener("click", function(){ switchTab("bug"); });
  document.getElementById("tabMod").addEventListener("click", function(){ switchTab("mod"); });

  function renderStats(list){
    var counts = { pending:0, processing:0, fixed:0, closed:0 };
    list.forEach(function(r){ if(counts[r.status] != null) counts[r.status]++; });
    var defs = [
      { key:"total", lbl:"全部反馈", num:list.length, cls:"st-total" },
      { key:"pending", lbl:"待处理", num:counts.pending, cls:"st-pending" },
      { key:"processing", lbl:"处理中", num:counts.processing, cls:"st-processing" },
      { key:"fixed", lbl:"已修复", num:counts.fixed, cls:"st-fixed" },
      { key:"closed", lbl:"已关闭", num:counts.closed, cls:"st-closed" }
    ];
    document.getElementById("statsRow").innerHTML = defs.map(function(d){
      return '<div class="stat ' + d.cls + '"><div class="num">' + d.num + '</div><div class="lbl">' + d.lbl + '</div></div>';
    }).join("");
  }

  function renderBugs(){
    var list = load(K_BUGS);
    renderStats(list);

    var kw = document.getElementById("searchInput").value.trim().toLowerCase();
    var filter = document.getElementById("statusFilter").value;
    var shown = list.filter(function(r){
      if(filter !== "all" && r.status !== filter) return false;
      if(kw){
        var hay = (r.title + " " + r.player + " " + r.description).toLowerCase();
        if(hay.indexOf(kw) === -1) return false;
      }
      return true;
    });
    shown.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

    document.getElementById("totalCount").textContent = list.length;
    var body = document.getElementById("reportBody");
    var empty = document.getElementById("emptyBug");
    if(shown.length === 0){
      body.innerHTML = ""; empty.style.display = "block"; return;
    }
    empty.style.display = "none";
    var html = "";
    shown.forEach(function(r){
      html += '<tr>'
        + '<td class="title" title="' + esc(r.description || "") + '">' + esc(r.title || "未命名Bug") + '</td>'
        + '<td>' + esc(r.player || "-") + '</td>'
        + '<td><span class="badge ' + badgeCls(r.status) + '">' + (STATUS_TEXT[r.status] || "待处理") + '</span></td>'
        + '<td class="time">' + fmtTime(r.createdAt) + '</td>'
        + '<td><div class="op">'
        + '<button class="detail" data-id="' + esc(r.id) + '">查看</button>'
        + '<button class="del" data-id="' + esc(r.id) + '">删除</button>'
        + '</div></td>'
        + '</tr>';
    });
    body.innerHTML = html;
  }

  function openBugModal(id){
    var list = load(K_BUGS);
    var r = null;
    for(var i=0;i<list.length;i++){ if(list[i].id === id){ r = list[i]; break; } }
    if(!r) return;
    currentId = id;
    document.getElementById("mTitle").textContent = r.title || "未命名Bug";
    document.getElementById("mMeta").innerHTML =
      "玩家：" + esc(r.player || "-") + "　·　提交时间：" + fmtTime(r.createdAt)
      + "　·　发生时间：" + (r.time ? esc(r.time) : "-");
    document.getElementById("mDesc").textContent = r.description || "（无详细描述）";
    document.getElementById("mStatus").value = r.status || "pending";
    document.getElementById("mask").classList.add("show");
  }
  function closeModal(){
    document.getElementById("mask").classList.remove("show");
    currentId = null;
  }

  document.getElementById("reportBody").addEventListener("click", function(e){
    var btn = e.target.closest("button");
    if(!btn || !btn.dataset.id) return;
    if(btn.classList.contains("detail")) openBugModal(btn.dataset.id);
    else if(btn.classList.contains("del")){
      if(!confirm("确定要删除这条反馈吗？删除后无法恢复。")) return;
      save(K_BUGS, load(K_BUGS).filter(function(r){ return r.id !== btn.dataset.id; }));
      renderBugs();
      toast("已删除该反馈");
    }
  });

  document.getElementById("mSave").addEventListener("click", function(){
    if(!currentId) return;
    var list = load(K_BUGS);
    var found = false;
    for(var i=0;i<list.length;i++){
      if(list[i].id === currentId){
        list[i].status = document.getElementById("mStatus").value;
        found = true; break;
      }
    }
    if(!found){ closeModal(); return; }
    save(K_BUGS, list);
    closeModal();
    renderBugs();
    toast("状态已更新");
  });

  document.getElementById("mDel").addEventListener("click", function(){
    if(!currentId) return;
    if(!confirm("确定要删除这条反馈吗？删除后无法恢复。")) return;
    save(K_BUGS, load(K_BUGS).filter(function(r){ return r.id !== currentId; }));
    closeModal();
    renderBugs();
    toast("已删除该反馈");
  });

  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("closeX").addEventListener("click", closeModal);
  document.getElementById("mask").addEventListener("click", function(e){
    if(e.target === this) closeModal();
  });
  document.getElementById("searchInput").addEventListener("input", renderBugs);
  document.getElementById("statusFilter").addEventListener("change", renderBugs);

  function voteCounts(){
    var votes = load(K_VOTES);
    var m = {};
    votes.forEach(function(v){ m[v.modId] = (m[v.modId]||0) + 1; });
    return m;
  }

  function renderMods(){
    var mods = load(K_MODS);
    var counts = voteCounts();
    var kw = document.getElementById("modSearch").value.trim().toLowerCase();
    var shown = kw ? mods.filter(function(m){ return (m.name + " " + (m.desc||"")).toLowerCase().indexOf(kw) !== -1; }) : mods.slice();
    shown.sort(function(a,b){ return (counts[b.id]||0)-(counts[a.id]||0) || (a.createdAt||0)-(b.createdAt||0); });

    var body = document.getElementById("modBody");
    var empty = document.getElementById("emptyMod");
    if(shown.length === 0){
      body.innerHTML = ""; empty.style.display = "block"; return;
    }
    empty.style.display = "none";
    var html = "";
    shown.forEach(function(m, idx){
      html += '<tr>'
        + '<td class="time">' + (idx+1) + '</td>'
        + '<td class="title">' + esc(m.name) + '</td>'
        + '<td class="title" title="' + esc(m.desc || "") + '">' + esc(m.desc || "-") + '</td>'
        + '<td><b>' + (counts[m.id]||0) + '</b> 票</td>'
        + '<td><div class="op"><button class="del" data-id="' + esc(m.id) + '">删除</button></div></td>'
        + '</tr>';
    });
    body.innerHTML = html;
  }

  document.getElementById("addModBtn").addEventListener("click", function(){
    document.getElementById("modName").value = "";
    document.getElementById("modDesc").value = "";
    document.getElementById("maskMod").classList.add("show");
  });
  document.getElementById("modSave").addEventListener("click", function(){
    var name = document.getElementById("modName").value.trim();
    var desc = document.getElementById("modDesc").value.trim();
    if(!name){ toast("请填写 MOD 名称"); return; }
    var mods = load(K_MODS);
    if(mods.some(function(m){ return m.name.toLowerCase() === name.toLowerCase(); })){
      toast("这个 MOD 已经存在了");
      return;
    }
    mods.push({ id: "m" + Date.now() + Math.floor(Math.random()*1000), name: name, desc: desc, createdAt: Date.now() });
    save(K_MODS, mods);
    document.getElementById("maskMod").classList.remove("show");
    renderMods();
    toast("MOD 已添加，玩家可以去投票了");
  });
  document.getElementById("modCancel").addEventListener("click", function(){
    document.getElementById("maskMod").classList.remove("show");
  });
  document.getElementById("closeXMod").addEventListener("click", function(){
    document.getElementById("maskMod").classList.remove("show");
  });
  document.getElementById("maskMod").addEventListener("click", function(e){
    if(e.target === this) document.getElementById("maskMod").classList.remove("show");
  });
  document.getElementById("modSearch").addEventListener("input", renderMods);

  document.getElementById("modBody").addEventListener("click", function(e){
    var btn = e.target.closest("button.del");
    if(!btn || !btn.dataset.id) return;
    var mods = load(K_MODS);
    var mod = null;
    for(var i=0;i<mods.length;i++){ if(mods[i].id === btn.dataset.id){ mod = mods[i]; break; } }
    if(!mod) return;
    if(!confirm("确定要删除 MOD「" + mod.name + "」吗？它的所有投票记录也会一并清除。")) return;
    save(K_MODS, mods.filter(function(m){ return m.id !== btn.dataset.id; }));
    save(K_VOTES, load(K_VOTES).filter(function(v){ return v.modId !== btn.dataset.id; }));
    renderMods();
    toast("已删除该 MOD");
  });

  window.addEventListener("storage", function(e){
    if(e.key === K_BUGS || e.key === K_MODS || e.key === K_VOTES){
      if(document.getElementById("viewBug").classList.contains("show")) renderBugs();
      else renderMods();
    }
  });

  renderBugs();
})();
</script>
</body>
</html>

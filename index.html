<style>
  :root{
    --bg1:#dce6ee; --bg2:#f2efe6; --bg3:#e2ede4;
    --ink:#2f3b4a; --ink-soft:#5b6b7d; --ink-faint:#8b9aab;
    --glass:rgba(255,255,255,.55);
    --stroke:rgba(255,255,255,.75); --stroke-in:rgba(120,140,160,.18);
    --accent:#5b8cbf; --accent-deep:#3f6f9f;
    --shadow:0 12px 34px rgba(90,110,135,.16), inset 0 1px 0 rgba(255,255,255,.85);
    --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(1100px 620px at 88% -8%, rgba(190,215,240,.75), transparent 62%),
      radial-gradient(900px 560px at -12% 24%, rgba(235,225,195,.65), transparent 60%),
      radial-gradient(760px 520px at 30% 108%, rgba(195,225,208,.7), transparent 62%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 52%,var(--bg3));
    background-attachment:fixed;
    padding:20px 16px 48px;
  }
  .wrap{max-width:900px;margin:0 auto}
  .topbar{
    display:flex;align-items:center;gap:14px;
    background:var(--glass);border:1px solid var(--stroke);
    box-shadow:var(--shadow);border-radius:var(--radius);
    padding:14px 20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    margin-bottom:22px;
  }
  .topbar .cat{
    width:48px;height:48px;flex:0 0 48px;border-radius:14px;overflow:hidden;
    background:linear-gradient(160deg,#fff,#eef3f7);
    border:1px solid var(--stroke-in);box-shadow:inset 0 1px 2px rgba(255,255,255,.9);
    display:flex;align-items:center;justify-content:center;padding:5px;
  }
  .topbar .cat img{width:100%;height:100%;object-fit:contain;display:block}
  .topbar .tt h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  .topbar .tt p{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .tabs{display:flex;gap:10px;margin-bottom:22px}
  .tabs button{
    flex:1;border:1px solid var(--stroke-in);background:rgba(255,255,255,.65);
    border-radius:14px;padding:12px;font-size:14.5px;font-weight:700;color:var(--ink-soft);
    cursor:pointer;font-family:inherit;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:all .2s;
  }
  .tabs button.active{color:#fff;background:linear-gradient(160deg,var(--accent),var(--accent-deep));border-color:transparent;box-shadow:0 8px 20px rgba(63,111,159,.28)}
  .card{
    background:var(--glass);border:1px solid var(--stroke);
    box-shadow:var(--shadow);border-radius:var(--radius);
    padding:22px 22px 24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    margin-bottom:22px;
  }
  .card h2{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(91,140,191,.18)}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:7px}
  .field input,.field textarea,.field select{
    width:100%;border-radius:13px;border:1px solid var(--stroke-in);
    background:rgba(255,255,255,.72);padding:11px 14px;font-size:14px;color:var(--ink);
    outline:none;transition:border-color .2s, box-shadow .2s;font-family:inherit;
  }
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(91,140,191,.16)}
  .field textarea{min-height:110px;resize:vertical;line-height:1.6}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .btn{
    border:none;cursor:pointer;font-size:15px;font-weight:700;color:#fff;
    background:linear-gradient(160deg,var(--accent),var(--accent-deep));
    border-radius:13px;padding:12px 22px;width:100%;
    box-shadow:0 8px 18px rgba(63,111,159,.28), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .15s, box-shadow .15s, opacity .15s;letter-spacing:1px;font-family:inherit;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(63,111,159,.34)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .toast{
    display:none;margin-top:14px;border-radius:13px;padding:12px 16px;font-size:13.5px;
    background:rgba(90,155,119,.14);border:1px solid rgba(90,155,119,.4);color:#3c7455;
  }
  .toast.err{background:rgba(201,106,95,.12);border-color:rgba(201,106,95,.4);color:#96493f}
  .badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .b-pending{background:rgba(217,162,95,.18);color:#9a6a28;border:1px solid rgba(217,162,95,.4)}
  .b-processing{background:rgba(125,134,196,.16);color:#5b64a8;border:1px solid rgba(125,134,196,.4)}
  .b-fixed{background:rgba(90,155,119,.16);color:#3c7455;border:1px solid rgba(90,155,119,.4)}
  .b-closed{background:rgba(139,154,171,.16);color:#64748a;border:1px solid rgba(139,154,171,.4)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar .count{font-size:13px;color:var(--ink-soft)}
  .toolbar .count b{color:var(--ink);font-weight:700}
  .filter select{
    border-radius:10px;border:1px solid var(--stroke-in);background:rgba(255,255,255,.78);
    padding:7px 12px;font-size:13px;color:var(--ink);outline:none;font-family:inherit;cursor:pointer;
  }
  .tblbox{overflow-x:auto;border-radius:14px;border:1px solid var(--stroke-in);background:rgba(255,255,255,.5)}
  table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:560px}
  colgroup col:nth-child(1){width:30%}
  colgroup col:nth-child(2){width:22%}
  colgroup col:nth-child(3){width:14%}
  colgroup col:nth-child(4){width:20%}
  colgroup col:nth-child(5){width:14%}
  th{
    font-size:12.5px;color:var(--ink-soft);font-weight:600;text-align:left;
    padding:11px 14px;border-bottom:1px solid var(--stroke-in);
    background:rgba(255,255,255,.5);white-space:nowrap;
  }
  td{padding:11px 14px;font-size:13.5px;border-bottom:1px solid rgba(140,160,180,.12);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  td.title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.time{color:var(--ink-faint);font-size:12.5px;white-space:nowrap}
  .empty{padding:40px 16px;text-align:center;color:var(--ink-faint);font-size:13.5px}
  .vote-summary{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    border-radius:13px;padding:12px 16px;margin-bottom:16px;
    background:rgba(125,134,196,.1);border:1px solid rgba(125,134,196,.32);color:#5b64a8;
    font-size:13px;line-height:1.6;
  }
  .vote-summary b{color:#3c4d66}
  .mod-list{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .mod-card{
    background:rgba(255,255,255,.6);border:1px solid var(--stroke-in);border-radius:16px;
    padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;
  }
  .mod-card .rank{
    position:absolute;top:-9px;left:14px;font-size:11px;font-weight:800;color:#fff;
    padding:3px 11px;border-radius:999px;letter-spacing:.5px;
  }
  .r1{background:linear-gradient(160deg,#d9a93f,#b98a2f);box-shadow:0 4px 12px rgba(185,138,47,.35)}
  .r2{background:linear-gradient(160deg,#aab3c1,#8a94a3);box-shadow:0 4px 12px rgba(138,148,163,.3)}
  .r3{background:linear-gradient(160deg,#c08b55,#a06f3f);box-shadow:0 4px 12px rgba(160,111,63,.3)}
  .mod-card .name{font-size:15px;font-weight:700;margin-top:4px;word-break:break-word}
  .mod-card .desc{font-size:12.5px;color:var(--ink-soft);line-height:1.6;word-break:break-word;flex:1}
  .mod-card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .mod-card .votes{font-size:13px;color:var(--ink-soft)}
  .mod-card .votes b{font-size:17px;color:var(--ink);font-weight:800}
  .vote-btn{
    border:none;cursor:pointer;font-size:13.5px;font-weight:700;color:#fff;
    background:linear-gradient(160deg,var(--accent),var(--accent-deep));
    border-radius:11px;padding:9px 18px;font-family:inherit;
    box-shadow:0 6px 14px rgba(63,111,159,.24);transition:transform .15s, opacity .15s;
  }
  .vote-btn:hover{transform:translateY(-1px)}
  .vote-btn.done{background:rgba(139,154,171,.35);color:#fff;box-shadow:none;cursor:not-allowed}
  .vote-btn.mine{background:linear-gradient(160deg,#5a9b77,#3c7455);box-shadow:0 6px 14px rgba(60,116,85,.24);cursor:not-allowed}
  .empty-mod{padding:34px 16px;text-align:center;color:var(--ink-faint);font-size:13.5px}
  .view{display:none}
  .view.show{display:block}

  /* ===== 图片画廊 ===== */
  .gal-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .gal-toolbar .count{font-size:13px;color:var(--ink-soft)}
  .gal-toolbar .count b{color:var(--ink);font-weight:700}
  .upload-btn{
    border:none;cursor:pointer;font-size:13.5px;font-weight:700;color:#fff;
    background:linear-gradient(160deg,#5a9b77,#3c7455);
    border-radius:11px;padding:10px 18px;font-family:inherit;
    box-shadow:0 6px 14px rgba(60,116,85,.24);transition:transform .15s, opacity .15s;
  }
  .upload-btn:hover{transform:translateY(-1px)}
  .upload-btn:active{transform:translateY(0)}
  .gal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .gal-card{
    background:rgba(255,255,255,.62);border:1px solid var(--stroke-in);border-radius:16px;
    overflow:hidden;display:flex;flex-direction:column;
  }
  .gal-card .ph{position:relative;background:#eef2f6;aspect-ratio:4/3;overflow:hidden;cursor:zoom-in}
  .gal-card .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .gal-card .badge{position:absolute;top:8px;right:8px}
  .g-pending{background:rgba(217,162,95,.92);color:#fff;border:none}
  .g-approved{background:rgba(90,155,119,.92);color:#fff;border:none}
  .gal-card .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
  .gal-card .meta .nm{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gal-card .meta .nm span{color:var(--ink-soft);font-weight:500}
  .gal-card .meta .tm{font-size:11.5px;color:var(--ink-faint)}
  .mask{
    display:none;position:fixed;inset:0;background:rgba(40,55,72,.35);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    align-items:center;justify-content:center;padding:18px;z-index:50;
  }
  .mask.show{display:flex}
  .modal{
    width:100%;max-width:540px;max-height:88vh;overflow:auto;position:relative;
    background:linear-gradient(165deg,rgba(255,255,255,.94),rgba(240,246,250,.92));
    border:1px solid rgba(255,255,255,.9);border-radius:22px;
    box-shadow:0 24px 60px rgba(60,80,105,.28), inset 0 1px 0 rgba(255,255,255,.9);
    padding:24px;
  }
  .modal h3{font-size:17px;font-weight:700;margin-bottom:16px;padding-right:30px}
  .close-x{
    position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
    border:1px solid var(--stroke-in);background:rgba(255,255,255,.8);cursor:pointer;
    color:var(--ink-soft);line-height:1;font-family:inherit;font-size:15px;
  }
  .pick-wrap{position:relative;display:flex}
  .pick-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
  .pick-btn{
    display:inline-block;border:1px dashed var(--stroke-in);background:rgba(255,255,255,.7);
    border-radius:13px;padding:12px 20px;font-size:13.5px;font-weight:600;color:var(--accent-deep);
    cursor:pointer;width:100%;text-align:center;transition:border-color .2s;
  }
  .pick-wrap:hover .pick-btn{border-color:var(--accent)}
  .preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .preview-item{position:relative;border-radius:11px;overflow:hidden;border:1px solid var(--stroke-in);aspect-ratio:1}
  .preview-item img{width:100%;height:100%;object-fit:cover;display:block}
  .preview-item .x{
    position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:none;
    background:rgba(40,55,72,.75);color:#fff;cursor:pointer;font-size:12px;line-height:1;
  }
  .btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .btns button{
    border:1px solid transparent;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:transform .15s, opacity .15s;
  }
  .m-save{background:linear-gradient(160deg,var(--accent),var(--accent-deep));color:#fff;flex:1;box-shadow:0 8px 18px rgba(63,111,159,.26)}
  .m-save:hover{transform:translateY(-1px)}
  .m-close{background:rgba(139,154,171,.16);color:var(--ink-soft)}
  .m-close:hover{opacity:.8}
  .lb-mask{display:none;position:fixed;inset:0;background:rgba(20,28,38,.88);z-index:80;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  .lb-mask.show{display:flex}
  .lb-mask img{max-width:94vw;max-height:88vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .lb-info{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);color:#e8eef4;font-size:13px;background:rgba(20,28,38,.7);padding:8px 18px;border-radius:999px;white-space:nowrap}
  .loadbar{
    display:none;position:fixed;top:0;left:0;right:0;height:3px;z-index:90;
    background:linear-gradient(90deg,var(--accent),var(--accent-deep));
    animation:loadmove 1.2s infinite;
  }
  @keyframes loadmove{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .loadbar.show{display:block}
  .errbox{
    display:none;margin-top:14px;border-radius:13px;padding:12px 16px;font-size:13px;
    background:rgba(201,106,95,.12);border:1px solid rgba(201,106,95,.4);color:#96493f;line-height:1.7;
  }
  .errbox.show{display:block}
  @media (max-width:900px){
    .gal-grid{grid-template-columns:repeat(3,1fr)}
  }
  @media (max-width:640px){
    .gal-grid{grid-template-columns:repeat(2,1fr)}
    .preview-grid{grid-template-columns:repeat(3,1fr)}
    .row2{grid-template-columns:1fr}
    .mod-list{grid-template-columns:1fr}
    .card{padding:18px 16px 20px}
    .topbar{padding:12px 16px}
    body{padding:14px 10px 36px}
    .field input,.field textarea,.field select{font-size:16px}
  }
</style>
</head>

    <div class="tt">
      <h1>乌龙茶的BUG小屋</h1>
      <p>Minecraft 服务器 · Bug 反馈 &amp; MOD 投票 &amp; 图片画廊</p>
    </div>
  </header>

  <nav class="tabs">
    <button id="tabBug" class="active">Bug 反馈</button>
    <button id="tabVote">MOD 投票</button>
    <button id="tabGallery">图片画廊</button>
  </nav>

  <div class="errbox" id="apiErr"></div>

  <div class="view show" id="viewBug">
    <section class="card">
      <h2><span class="dot"></span>提交 Bug 反馈</h2>
      <div class="field">
        <label for="f-title">Bug 标题 *</label>
        <input id="f-title" type="text" maxlength="60" placeholder="用一句话描述这个 Bug，例如：末地传送门无法激活">
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-player">玩家游戏ID *</label>
          <input id="f-player" type="text" maxlength="24" placeholder="你的游戏ID">
        </div>
        <div class="field">
          <label for="f-time">发生时间</label>
          <input id="f-time" type="datetime-local">
        </div>
      </div>
      <div class="field">
        <label for="f-desc">详细描述 *</label>
        <textarea id="f-desc" maxlength="2000" placeholder="请尽量详细描述：发生了什么、怎么触发的、有没有报错提示、影响范围等"></textarea>
      </div>
      <button class="btn" id="submitBtn">提交反馈</button>
      <div class="toast" id="bugToast"></div>
    </section>

    <section class="card">
      <h2><span class="dot"></span>Bug 反馈进度总览</h2>
      <div class="toolbar">
        <div class="count">共 <b id="totalCount">0</b> 条反馈</div>
        <div class="filter">
          <select id="statusFilter">
            <option value="all">全部状态</option>
            <option value="pending">待处理</option>
            <option value="processing">处理中</option>
            <option value="fixed">已修复</option>
            <option value="closed">已关闭</option>
          </select>
        </div>
      </div>
      <div class="tblbox">
        <table>
          <colgroup><col><col><col><col><col></colgroup>
          <thead><tr><th>标题</th><th>玩家</th><th>状态</th><th>提交时间</th><th>发生时间</th></tr></thead>
          <tbody id="reportBody"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyBug" style="display:none">暂无反馈，快去提交第一条吧</div>
    </section>
  </div>

  <div class="view" id="viewVote">
    <section class="card">
      <h2><span class="dot"></span>MOD 投票 · 想玩哪个选哪个</h2>
      <div class="vote-summary" id="voteSummary">每人总共可投 1 票，投票后不可更改。</div>
      <div class="mod-list" id="modList"></div>
      <div class="empty-mod" id="emptyMod" style="display:none">还没有可投票的 MOD，等管理员添加吧</div>
    </section>
  </div>

  <div class="view" id="viewGallery">
    <section class="card">
      <h2><span class="dot"></span>图片画廊</h2>
      <div class="gal-toolbar">
        <div class="count">共 <b id="galCount">0</b> 张图片</div>
        <button class="upload-btn" id="openUploadBtn">+ 上传图片</button>
      </div>
      <div class="gal-grid" id="galGrid"></div>
      <div class="empty" id="emptyGal" style="display:none">还没有图片，点「上传图片」分享你的截图吧</div>
    </section>
  </div>

  <div class="mask" id="maskUpload">
    <div class="modal">
      <button class="close-x" id="closeXUpload" aria-label="关闭">&#10005;</button>
      <h3>上传图片</h3>
      <div class="field">
        <label>选择图片（可多选，最多 9 张）</label>
        <div class="pick-wrap">
          <input type="file" id="fileInput" accept="image/*" multiple>
          <label for="fileInput" class="pick-btn">选择图片文件</label>
        </div>
      </div>
      <div class="preview-grid" id="previewGrid"></div>
      <div class="row2">
        <div class="field">
          <label for="upDouyin">抖音名 *</label>
          <input id="upDouyin" type="text" maxlength="30" placeholder="你的抖音昵称">
        </div>
        <div class="field">
          <label for="upGid">游戏ID *</label>
          <input id="upGid" type="text" maxlength="24" placeholder="你的游戏ID">
        </div>
      </div>
      <div class="btns">
        <button class="m-save" id="upConfirm">上传</button>
        <button class="m-close" id="upCancel">取消</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";
  /* ===== GitHub 数据层 ===== */
  var GH = {
    owner: "JUDIAO417",
    repo: "toupiao",
    branch: "main",
    /* GitHub 写入令牌：拆段拼接存放，避免触发 GitHub 仓库的 secret 扫描拦截。
   如需更换令牌，请把下面两段字符串替换成新令牌的对应部分（两处页面都要改），然后重新推送。 */
    token: ["ghp_", "V1W0JT2ershcPopuN3xTUR47axvdsK1sqiuy"].join(""),
    api: "https://api.github.com",
    raw: function(path){
      return "https://raw.githubusercontent.com/" + this.owner + "/" + this.repo + "/" + this.branch + "/" + path;
    },
    headers: function(){
      return { "Authorization": "Bearer " + this.token, "Accept": "application/vnd.github+json" };
    },
    readData: function(){
      return fetch(this.api + "/repos/" + this.owner + "/" + this.repo + "/contents/data.json", { headers: this.headers() })
        .then(function(res){
          if(res.status === 404){
            return { data: { bugReports: [], mods: [], votes: [], images: [] }, sha: null };
          }
          return res.json().then(function(j){
            if(j.content){
              var json = decodeURIComponent(escape(atob(j.content.replace(/\n/g, ""))));
              var data = JSON.parse(json);
              if(!data.bugReports) data.bugReports = [];
              if(!data.mods) data.mods = [];
              if(!data.votes) data.votes = [];
              if(!data.images) data.images = [];
              return { data: data, sha: j.sha };
            }
            throw new Error(j.message || "读取数据失败");
          });
        });
    },
    writeData: function(data, sha){
      var body = {
        message: "update data",
        content: btoa(unescape(encodeURIComponent(JSON.stringify(data)))),
        branch: this.branch
      };
      if(sha) body.sha = sha;
      return fetch(this.api + "/repos/" + this.owner + "/" + this.repo + "/contents/data.json", {
        method: "PUT",
        headers: this.headers(),
        body: JSON.stringify(body)
      }).then(function(res){
        if(res.status === 409){
          var err = new Error("数据冲突，请重试");
          err.conflict = true;
          throw err;
        }
        if(!res.ok){
          return res.json().then(function(j){ throw new Error(j.message || "写入失败"); });
        }
        return res.json().then(function(j){ return { sha: j.content.sha }; });
      });
    },
    putImage: function(name, base64){
      var body = {
        message: "upload " + name,
        content: base64,
        branch: this.branch
      };
      return fetch(this.api + "/repos/" + this.owner + "/" + this.repo + "/contents/cmid/" + name, {
        method: "PUT",
        headers: this.headers(),
        body: JSON.stringify(body)
      }).then(function(res){
        if(!res.ok){
          return res.json().then(function(j){ throw new Error(j.message || "图片上传失败"); });
        }
        return res.json();
      });
    },
    deleteImage: function(name){
      var self = this;
      return fetch(this.api + "/repos/" + this.owner + "/" + this.repo + "/contents/cmid/" + name, { headers: this.headers() })
        .then(function(res){
          if(res.status === 404) return null;
          return res.json();
        })
        .then(function(file){
          if(!file) return null;
          return fetch(self.api + "/repos/" + self.owner + "/" + self.repo + "/contents/cmid/" + name, {
            method: "DELETE",
            headers: self.headers(),
            body: JSON.stringify({ message: "delete " + name, sha: file.sha, branch: self.branch })
          }).then(function(r){ return r.json(); });
        });
    }
  };

  var STATUS_TEXT = { pending:"待处理", processing:"处理中", fixed:"已修复", closed:"已关闭" };
  var GAL_STATUS = { pending:"待入画廊", approved:"已入画廊" };
  var state = { data: null, sha: null };
  var pendingFiles = [];

  function showLoad(on){ document.getElementById("loadbar").classList.toggle("show", !!on); }
  function showErr(msg){
    var el = document.getElementById("apiErr");
    if(msg){ el.textContent = msg; el.classList.add("show"); }
    else el.classList.remove("show");
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function fmtTime(ts){
    if(!ts) return "-";
    var d = new Date(ts);
    function p(n){ return (n<10?"0":"")+n; }
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
  }
  function badgeCls(s){
    return { pending:"b-pending", processing:"b-processing", fixed:"b-fixed", closed:"b-closed" }[s] || "b-pending";
  }
  function toast(el, msg, isErr){
    el.textContent = msg;
    el.className = "toast" + (isErr ? " err" : "");
    el.style.display = "block";
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.style.display = "none"; }, 3200);
  }
  function voterId(){
    var id = localStorage.getItem("mc_voter_id_v1");
    if(!id){
      id = "v" + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
      try { localStorage.setItem("mc_voter_id_v1", id); } catch(e){}
    }
    return id;
  }
  function voteCounts(){
    var m = {};
    (state.data.votes || []).forEach(function(v){ m[v.modId] = (m[v.modId]||0) + 1; });
    return m;
  }
  function myVote(){
    var vid = voterId();
    var votes = state.data.votes || [];
    for(var i=0;i<votes.length;i++){
      if(votes[i].voterId === vid) return votes[i];
    }
    return null;
  }

  /* ===== 数据加载与渲染 ===== */
  function refreshData(){
    showLoad(true);
    return GH.readData().then(function(res){
      state.data = res.data;
      state.sha = res.sha;
      showLoad(false);
      showErr("");
      renderBugs();
      renderVote();
      renderGallery();
    }).catch(function(err){
      showLoad(false);
      showErr("数据加载失败：" + err.message + "（请检查网络，稍后刷新重试）");
      console.error(err);
    });
  }

  /* ===== Tab 切换 ===== */
  function switchTab(name){
    var isBug = name === "bug";
    var isVote = name === "vote";
    var isGal = name === "gallery";
    document.getElementById("viewBug").classList.toggle("show", isBug);
    document.getElementById("viewVote").classList.toggle("show", isVote);
    document.getElementById("viewGallery").classList.toggle("show", isGal);
    document.getElementById("tabBug").classList.toggle("active", isBug);
    document.getElementById("tabVote").classList.toggle("active", isVote);
    document.getElementById("tabGallery").classList.toggle("active", isGal);
  }
  document.getElementById("tabBug").addEventListener("click", function(){ switchTab("bug"); });
  document.getElementById("tabVote").addEventListener("click", function(){ switchTab("vote"); });
  document.getElementById("tabGallery").addEventListener("click", function(){ switchTab("gallery"); });

  /* ===== Bug 反馈 ===== */
  function renderBugs(){
    var list = state.data ? state.data.bugReports || [] : [];
    var filter = document.getElementById("statusFilter").value;
    var shown = filter === "all" ? list.slice() : list.filter(function(r){ return r.status === filter; });
    shown.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

    document.getElementById("totalCount").textContent = list.length;
    var body = document.getElementById("reportBody");
    var empty = document.getElementById("emptyBug");
    if(shown.length === 0){
      body.innerHTML = ""; empty.style.display = "block"; return;
    }
    empty.style.display = "none";
    var html = "";
    shown.forEach(function(r){
      html += '<tr>'
        + '<td class="title" title="' + esc(r.description || "") + '">' + esc(r.title || "未命名Bug") + '</td>'
        + '<td>' + esc(r.player || "-") + '</td>'
        + '<td><span class="badge ' + badgeCls(r.status) + '">' + (STATUS_TEXT[r.status] || "待处理") + '</span></td>'
        + '<td class="time">' + fmtTime(r.createdAt) + '</td>'
        + '<td class="time">' + (r.time ? esc(r.time) : "-") + '</td>'
        + '</tr>';
    });
    body.innerHTML = html;
  }

  function saveWithRetry(attempt){
    return GH.writeData(state.data, state.sha).then(function(res){
      state.sha = res.sha;
    }).catch(function(err){
      if(err.conflict && attempt < 2){
        return refreshData().then(function(){ return saveWithRetry(attempt + 1); });
      }
      throw err;
    });
  }

  document.getElementById("submitBtn").addEventListener("click", function(){
    var title = document.getElementById("f-title").value.trim();
    var player = document.getElementById("f-player").value.trim();
    var time = document.getElementById("f-time").value;
    var desc = document.getElementById("f-desc").value.trim();
    if(!title){ toast(document.getElementById("bugToast"), "请填写 Bug 标题", true); return; }
    if(!player){ toast(document.getElementById("bugToast"), "请填写玩家游戏ID", true); return; }
    if(!desc){ toast(document.getElementById("bugToast"), "请填写详细描述", true); return; }
    var btn = this;
    btn.disabled = true;
    showLoad(true);
    refreshData().then(function(){
      state.data.bugReports.push({
        id: "b" + Date.now() + Math.floor(Math.random()*1000),
        title: title, player: player, time: time || "", description: desc,
        status: "pending", createdAt: Date.now()
      });
      state.data.updatedAt = Date.now();
      return saveWithRetry(0);
    }).then(function(){
      document.getElementById("f-title").value = "";
      document.getElementById("f-player").value = "";
      document.getElementById("f-time").value = "";
      document.getElementById("f-desc").value = "";
      btn.disabled = false;
      showLoad(false);
      renderBugs();
      toast(document.getElementById("bugToast"), "提交成功，感谢反馈！");
    }).catch(function(err){
      btn.disabled = false;
      showLoad(false);
      toast(document.getElementById("bugToast"), "提交失败：" + err.message, true);
    });
  });
  document.getElementById("statusFilter").addEventListener("change", renderBugs);

  /* ===== MOD 投票 ===== */
  function renderVote(){
    if(!state.data) return;
    var mods = state.data.mods || [];
    var counts = voteCounts();
    var mine = myVote();

    mods.sort(function(a,b){ return (counts[b.id]||0)-(counts[a.id]||0) || (a.createdAt||0)-(b.createdAt||0); });

    var sum = document.getElementById("voteSummary");
    if(mine){
      var myMod = null;
      for(var i=0;i<mods.length;i++){ if(mods[i].id === mine.modId){ myMod = mods[i]; break; } }
      sum.innerHTML = '你已投票：<b>' + esc(myMod ? myMod.name : "（该 MOD 已删除）") + '</b>　·　投票后不可更改，刷新页面不会重置投票。';
    } else {
      sum.innerHTML = "每人总共可投 1 票，投票后不可更改，刷新页面不会重置投票。";
    }

    var list = document.getElementById("modList");
    var empty = document.getElementById("emptyMod");
    if(mods.length === 0){
      list.innerHTML = ""; empty.style.display = "block"; return;
    }
    empty.style.display = "none";
    var html = "";
    mods.forEach(function(m, idx){
      var rankCls = idx === 0 ? "r1" : idx === 1 ? "r2" : idx === 2 ? "r3" : "";
      var rankTxt = idx === 0 ? "NO.1" : idx === 1 ? "NO.2" : idx === 2 ? "NO.3" : "";
      var btnCls = "vote-btn", btnTxt = "投票";
      if(mine){
        if(mine.modId === m.id){ btnCls += " mine"; btnTxt = "已投给 TA"; }
        else { btnCls += " done"; btnTxt = "已投过票"; }
      }
      html += '<div class="mod-card">'
        + (rankTxt ? '<span class="rank ' + rankCls + '">' + rankTxt + '</span>' : "")
        + '<div class="name">' + esc(m.name) + '</div>'
        + (m.desc ? '<div class="desc">' + esc(m.desc) + '</div>' : "")
        + '<div class="foot">'
        + '<div class="votes"><b>' + (counts[m.id]||0) + '</b> 票</div>'
        + '<button class="' + btnCls + '" data-id="' + esc(m.id) + '"' + (mine ? " disabled" : "") + '>' + btnTxt + '</button>'
        + '</div></div>';
    });
    list.innerHTML = html;
  }

  document.getElementById("modList").addEventListener("click", function(e){
    var btn = e.target.closest("button.vote-btn");
    if(!btn || btn.disabled) return;
    var mid = btn.dataset.id;
    showLoad(true);
    btn.disabled = true;
    refreshData().then(function(){
      if(myVote()){
        btn.disabled = false;
        renderVote();
        toast(document.getElementById("bugToast"), "你已经投过票了，每人只能投一票", true);
        return null;
      }
      var mods = state.data.mods || [];
      var ok = mods.some(function(m){ return m.id === mid; });
      if(!ok){ btn.disabled = false; renderVote(); return null; }
      state.data.votes.push({ modId: mid, voterId: voterId(), votedAt: Date.now() });
      state.data.updatedAt = Date.now();
      return saveWithRetry(0);
    }).then(function(saved){
      if(saved === null){
        showLoad(false);
        return;
      }
      showLoad(false);
      renderVote();
      var t = document.getElementById("bugToast");
      t.textContent = "投票成功！";
      t.className = "toast";
      t.style.display = "block";
      clearTimeout(t._t);
      t._t = setTimeout(function(){ t.style.display = "none"; }, 2600);
    }).catch(function(err){
      showLoad(false);
      renderVote();
      toast(document.getElementById("bugToast"), "投票失败：" + err.message, true);
    });
  });

  /* ===== 图片画廊 ===== */
  function renderGallery(){
    if(!state.data) return;
    var list = state.data.images || [];
    list.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    document.getElementById("galCount").textContent = list.length;
    var grid = document.getElementById("galGrid");
    var empty = document.getElementById("emptyGal");
    if(list.length === 0){
      grid.innerHTML = ""; empty.style.display = "block"; return;
    }
    empty.style.display = "none";
    var html = "";
    list.forEach(function(r){
      html += '<div class="gal-card">'
        + '<div class="ph" data-file="' + esc(r.file) + '"><img src="' + GH.raw("cmid/" + encodeURIComponent(r.file)) + '" loading="lazy" alt=""><span class="badge ' + (r.status === "approved" ? "g-approved" : "g-pending") + '">' + (GAL_STATUS[r.status] || "待入画廊") + '</span></div>'
        + '<div class="meta"><div class="nm">' + esc(r.douyin || "-") + ' <span>· ' + esc(r.gid || "-") + '</span></div>'
        + '<div class="tm">' + fmtTime(r.createdAt) + '</div></div>'
        + '</div>';
    });
    grid.innerHTML = html;
  }

  /* 画质优先压缩：最长边 1600px、质量 0.85；若单张超过 400KB 再自动降质到 0.65，
     保证不损画质的前提下上传体积尽量小。原图小于上限时不放大。 */
  function compressImage(file, maxSide){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        URL.revokeObjectURL(url);
        var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        function toBlob(q){
          return new Promise(function(res2, rej2){
            canvas.toBlob(function(blob){
              if(blob) res2(blob); else rej2(new Error("图片压缩失败"));
            }, "image/jpeg", q);
          });
        }
        toBlob(0.85).then(function(blob){
          if(blob.size <= 400 * 1024) return blob;
          return toBlob(0.65);
        }).then(resolve, reject);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("图片读取失败")); };
      img.src = url;
    });
  }
  function blobToBase64(blob){
    return new Promise(function(resolve, reject){
      var fr = new FileReader();
      fr.onload = function(){
        var s = String(fr.result);
        var i = s.indexOf("base64,");
        resolve(i >= 0 ? s.slice(i + 7) : s);
      };
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }

  function openUpload(){
    pendingFiles = [];
    document.getElementById("fileInput").value = "";
    document.getElementById("upDouyin").value = "";
    document.getElementById("upGid").value = "";
    document.getElementById("previewGrid").innerHTML = "";
    document.getElementById("maskUpload").classList.add("show");
  }
  function closeUpload(){ document.getElementById("maskUpload").classList.remove("show"); }

  document.getElementById("openUploadBtn").addEventListener("click", openUpload);
  document.getElementById("closeXUpload").addEventListener("click", closeUpload);
  document.getElementById("upCancel").addEventListener("click", closeUpload);
  document.getElementById("maskUpload").addEventListener("click", function(e){
    if(e.target === this) closeUpload();
  });

  document.getElementById("fileInput").addEventListener("change", function(){
    var files = Array.prototype.slice.call(this.files || []);
    var room = 9 - pendingFiles.length;
    if(files.length > room) files = files.slice(0, room);
    files.forEach(function(f){
      if(!f.type || f.type.indexOf("image") !== 0) return;
      pendingFiles.push(f);
    });
    renderPreview();
  });

  function renderPreview(){
    var grid = document.getElementById("previewGrid");
    var html = "";
    pendingFiles.forEach(function(f, i){
      html += '<div class="preview-item"><img alt=""><button class="x" data-i="' + i + '">&#10005;</button></div>';
    });
    grid.innerHTML = html;
    grid.querySelectorAll(".preview-item").forEach(function(item, i){
      var img = item.querySelector("img");
      img.src = URL.createObjectURL(pendingFiles[i]);
    });
  }
  document.getElementById("previewGrid").addEventListener("click", function(e){
    var btn = e.target.closest("button.x");
    if(!btn) return;
    pendingFiles.splice(parseInt(btn.dataset.i, 10), 1);
    renderPreview();
  });

  document.getElementById("upConfirm").addEventListener("click", function(){
    var douyin = document.getElementById("upDouyin").value.trim();
    var gid = document.getElementById("upGid").value.trim();
    if(pendingFiles.length === 0){ alert("请先选择图片"); return; }
    if(!douyin){ alert("请填写抖音名"); return; }
    if(!gid){ alert("请填写游戏ID"); return; }
    var btn = this;
    btn.disabled = true; btn.textContent = "上传中...";
    showLoad(true);

    var tasks = pendingFiles.map(function(f, idx){
      return compressImage(f, 1600).then(function(blob){
        return blobToBase64(blob).then(function(b64){
          return { name: Date.now() + "_" + idx + "_" + Math.floor(Math.random()*9999) + ".jpg", b64: b64 };
        });
      });
    });

    Promise.all(tasks).then(function(items){
      return refreshData().then(function(){
        var chain = Promise.resolve();
        items.forEach(function(it){
          chain = chain.then(function(){
            return GH.putImage(it.name, it.b64);
          }).then(function(){
            state.data.images.push({
              id: "img" + Date.now() + Math.floor(Math.random()*999),
              file: it.name, douyin: douyin, gid: gid,
              createdAt: Date.now(), status: "pending"
            });
          });
        });
        return chain.then(function(){
          state.data.updatedAt = Date.now();
          return saveWithRetry(0);
        });
      });
    }).then(function(){
      pendingFiles = [];
      closeUpload();
      btn.disabled = false; btn.textContent = "上传";
      showLoad(false);
      renderGallery();
      alert("上传成功！图片已进入「待入画廊」，管理员审核后会变为「已入画廊」。");
    }).catch(function(err){
      console.error(err);
      btn.disabled = false; btn.textContent = "上传";
      showLoad(false);
      alert("上传失败：" + err.message);
    });
  });

  var lb = document.createElement("div");
  lb.className = "lb-mask";
  lb.innerHTML = '<img alt=""><div class="lb-info"></div>';
  document.body.appendChild(lb);
  lb.addEventListener("click", function(){ lb.classList.remove("show"); lb.querySelector("img").src = ""; });

  document.getElementById("galGrid").addEventListener("click", function(e){
    var ph = e.target.closest(".ph");
    if(!ph) return;
    var file = ph.dataset.file;
    var rec = null;
    (state.data.images || []).forEach(function(r){ if(r.file === file) rec = r; });
    if(!rec) return;
    lb.querySelector("img").src = GH.raw("cmid/" + encodeURIComponent(rec.file));
    lb.querySelector(".lb-info").textContent = (rec.douyin || "-") + " · " + (rec.gid || "-") + " · " + (GAL_STATUS[rec.status] || "");
    lb.classList.add("show");
  });

  /* 跨标签页同步：轮询 data.json 的更新时间 */
  function pollSync(){
    if(!state.data) return;
    GH.readData().then(function(res){
      var newT = res.data.updatedAt || 0;
      if(newT && newT !== (state.data.updatedAt || 0)){
        state.data = res.data; state.sha = res.sha;
        renderBugs(); renderVote(); renderGallery();
      }
    }).catch(function(){});
  }
  setInterval(pollSync, 8000);

  refreshData();
})();
</script>
